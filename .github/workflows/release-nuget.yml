name: Build and push to nuget

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack SqlBlame
        run: |
          # Strip the 'v' from the tag (v1.0.3 becomes 1.0.3)
          VERSION="${GITHUB_REF_NAME#v}"

          dotnet pack ./SqlBlame.Cli/SqlBlame.Cli.csproj -c Release -p:Version="$VERSION" -o ./nuget-out
          
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address
          
      - name: Push to NuGet
        run: |
          dotnet nuget push ./nuget-out/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SqlBlame-NuGet-Package-${{ github.ref_name }}
          path: ./nuget-out/*.nupkg
          retention-days: 7