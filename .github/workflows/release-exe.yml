name: Build and release executable

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish SqlBlame
        run: |
          # Strip the 'v' from the tag (v1.0.3 becomes 1.0.3)
          VERSION="${GITHUB_REF_NAME#v}"

          dotnet publish ./SqlBlame.Cli/SqlBlame.Cli.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version="$VERSION" -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SqlBlame-${{ github.ref_name }}
          path: publish/SqlBlame.exe
          retention-days: 7